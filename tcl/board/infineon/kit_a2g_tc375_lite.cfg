#
# Infineon AURIX TC375 Lite Kit V2 (KIT_A2G_TC375_LITE)
#
# https://www.infineon.com/cms/en/product/evaluation-boards/kit_a2g_tc375_lite/
#
# The board carries an on-board miniWiggler V3 debug probe. The probe is an
# FT2232H exposing two interfaces on a single USB device (058b:0043):
#
#   interface 0 - AURIX DAP, driven by the miniwiggler adapter driver
#   interface 1 - virtual COM port for the target UART
#
# contrib/60-openocd.rules unbinds ftdi_sio from interface 0 on hotplug,
# leaving interface 1 alone so the UART keeps working. Without that rule
# installed, and on a kernel that binds ftdi_sio to interface 0 as well,
# claiming the interface fails with LIBUSB_ERROR_BUSY; work around it by
# hand with:
#
#   echo '<bus>-<port>:1.0' > /sys/bus/usb/drivers/ftdi_sio/unbind
#
# Usage:
#   openocd -f board/infineon/kit_a2g_tc375_lite.cfg \
#           -c "program firmware.elf verify reset exit"
#

adapter driver miniwiggler

# Uncomment and adjust for a standalone miniWiggler with a different
# VID:PID programmed into its EEPROM.
# miniwiggler vid_pid 0x058b 0x0043

adapter speed 5000

source [find target/infineon/tc37x.cfg]
