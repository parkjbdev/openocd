# Target configuration for Infineon AURIX TC37x EXT devices.
#
# TC37x_EXT is the same TriCore 1.6.2P core layout as TC37x, but is
# identified on the JTAG chain by a different OCMTS TAP ID.

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME tc37x_ext
}

if { [info exists OCMTS_TAPID] } {
	set _OCMTS_TAPID $OCMTS_TAPID
} else {
	set _OCMTS_TAPID 0x10208083
}

transport select ifxdap

# The AURIX debug interface has no independent core reset; the only reset
# available through the DAP is the system reset line.
reset_config srst_only

# Create new ocmts
ifxdap newtap $_CHIPNAME ocmts -irlen 8 -expected-id $_OCMTS_TAPID
ocmts create tc3xx -chain-position $_CHIPNAME.ocmts

# Create targets
target create $_CHIPNAME.cpu0 tricore -coreid 0 -ocmts tc3xx -dbgbase 0xF8800000
target create $_CHIPNAME.cpu1 tricore -coreid 1 -ocmts tc3xx -dbgbase 0xF8820000
target create $_CHIPNAME.cpu2 tricore -coreid 2 -ocmts tc3xx -dbgbase 0xF8840000

# Create workarea
$_CHIPNAME.cpu0 configure -work-area-phys 0x70000000 -work-area-size 0x8000 -work-area-backup 0

# Create flash banks.
#
# The program flash is visible twice: segment 8 is the cached alias and
# segment A the non-cached alias of the same physical memory. The reset
# vector lives in the non-cached alias, so images are commonly linked at
# 0xa0000000 and either link address needs to be programmable.
#
# Declare the physical banks in the cached alias and expose the non-cached
# alias with the "virtual" driver rather than declaring the same memory
# twice. The virtual banks share the master bank's sector array, so the
# erase state of a physical sector cannot diverge between the two views and
# writing pieces of one sector through different aliases stays consistent.
flash bank pfls0    tc3x_eflash 0x80000000 0x300000 0 0 $_CHIPNAME.cpu0
flash bank pfls1    tc3x_eflash 0x80300000 0x300000 0 0 $_CHIPNAME.cpu0
flash bank pfls0_nc virtual     0xa0000000 0 0 0 $_CHIPNAME.cpu0 pfls0
flash bank pfls1_nc virtual     0xa0300000 0 0 0 $_CHIPNAME.cpu0 pfls1

targets $_CHIPNAME.cpu0
