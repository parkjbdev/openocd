# Target configuration for Infineon AURIX TC27x devices (first generation
# AURIX).
#
# Verified against a KIT_AURIX_LITE_KIT V1.1 (USB serial LK7U8NLP, TC275)
# on 2026-10-02 with a TAP-less DAP transport. What was checked on silicon:
#
#   SCU_CHIPID @ 0xF0036140        = 0x47467072
#     CHTEC (bits 7:6)  = 0x40  -> TC2x, not TC3x (which reports 0x80)
#     CHID  (bits 15:12)= 0x7   -> TC27x (TC29x would be 0x9)
#     FSIZE (bits 27:24)= 0x7   -> 4096 KiB program flash, matching the
#                                    two 2 MiB banks declared below
#   3 cores examined: CPU0 "1.6E", CPU1/CPU2 "1.6P". The per-core SFR block
#   base and the 0x20000 stride below are confirmed by that examination
#   succeeding: the target driver reads the core ID and version register
#   through each dbgbase.
#   0xA0000000 is a non-cached alias of 0x80000000: reading the same words
#   through both windows returns identical data, and both windows fail
#   identically in erased regions, so the NC banks below are needed exactly
#   as they are on TC3x.
#
# OCMTS_TAPID is NOT verified. The ifxdap transport never shifts a real
# IDCODE (its transport init is a no-op, so tap->has_idcode stays false), and
# src/jtag/core.c skips the -expected-id check in that case. The value below
# is the one from the upstream tricore-oss configuration and is used by the
# driver to pick the family, so changing it changes behaviour silently.
if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME tc27x
}

if { [info exists OCMTS_TAPID] } {
    set _OCMTS_TAPID $OCMTS_TAPID
} else {
    set _OCMTS_TAPID 0x501DA083
}

transport select ifxdap

# The AURIX debug interface has no independent core reset; the only reset
# available through the DAP is the system reset line.
reset_config srst_only

# Create new ocmts
ifxdap newtap $_CHIPNAME ocmts -irlen 8 -expected-id $_OCMTS_TAPID
ocmts create tc2xx -chain-position $_CHIPNAME.ocmts

# Create targets
target create $_CHIPNAME.cpu0 tricore -coreid 0 -ocmts tc2xx -dbgbase 0xF8800000
target create $_CHIPNAME.cpu1 tricore -coreid 1 -ocmts tc2xx -dbgbase 0xF8820000
target create $_CHIPNAME.cpu2 tricore -coreid 2 -ocmts tc2xx -dbgbase 0xF8840000

# Create workarea
$_CHIPNAME.cpu0 configure -work-area-phys 0x70000000 -work-area-size 0x8000 -work-area-backup 0

# Create flash banks: 2 x 2 MiB program flash, 384 KiB data flash EEPROM,
# 16 KiB UCB and 64 KiB standby RAM, all in segment 0xAF.
#
# src/flash/nor/drivers.c registers tc2x_eflash alongside tc3x_eflash/
# tc4x_eflash/tc4x_rram, and src/flash/nor/aurix_eflash.c implements the TC2x
# bank layout (tc2x_eflash_probe() et al). Flash write/erase through this
# driver is hardware-validated: the shared regression suite's program/erase/
# verify sections (2-7) pass on a real TC275 Lite Kit, reaching 71/71 overall
# (test-aurix-hardware-tc2x.cfg).
#
# The sector geometry the tc2x loader expects is 16 KiB at the start of each
# program flash bank, doubling up to 256 KiB, with 4 KiB logical pages and
# 256-byte bursts; see contrib/loaders/flash/aurix/tc2x-flash.h.
#
# Upstream's tc27x.cfg and upstream's own tc2x_eflash bank layout disagree
# about the data flash bank (0x60000 here vs 348 KiB there); the loader
# source in this tree is the more reliable of the two, and the discrepancy
# is left for whoever revisits DFlash/UCB support (not yet exercised by the
# suite, which only covers the program flash banks above).
foreach _b {
    {pfls0 0x80000000 0x200000}
    {pfls1 0x80200000 0x200000}
} {
    if {[catch {flash bank [lindex $_b 0] tc2x_eflash [lindex $_b 1] \
            [lindex $_b 2] 0 0 $_CHIPNAME.cpu0} _err]} {
        puts "WARNING: could not declare flash bank [lindex $_b 0]: $_err"
    }
}

# Non-cached aliases of the two program flash banks, exposed through the
# "virtual" driver so both views share one sector state. This is what makes
# an image linked at the 0xa0000000 reset vector programmable without
# translating addresses, exactly as on TC3x.
foreach _v {
    {pfls0_nc 0xa0000000 pfls0}
    {pfls1_nc 0xa0200000 pfls1}
} {
    if {[catch {flash bank [lindex $_v 0] virtual [lindex $_v 1] 0 0 0 \
            $_CHIPNAME.cpu0 [lindex $_v 2]} _err]} {
        puts "WARNING: could not declare flash bank [lindex $_v 0]: $_err"
    }
}

foreach _b {
    {dfls0 0xaf000000 0x60000}
    {ucb    0xaf100000 0x4000}
    {dfls1 0xaf110000 0x10000}
} {
    if {[catch {flash bank [lindex $_b 0] tc2x_eflash [lindex $_b 1] \
            [lindex $_b 2] 0 0 $_CHIPNAME.cpu0} _err]} {
        puts "WARNING: could not declare flash bank [lindex $_b 0]: $_err"
    }
}

targets $_CHIPNAME.cpu0
