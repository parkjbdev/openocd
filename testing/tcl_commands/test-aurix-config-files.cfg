# Parse the AURIX board and target configuration files shipped in tcl/
# and check that they declare the expected targets and flash banks.
#
# No hardware is touched: the adapter is selected but never initialised,
# because the test shuts down before entering the run stage.

namespace import testing_helpers::*

source [find board/infineon/kit_a2g_tc375_lite.cfg]

# The TC37x has three TriCore cores, and cpu0 is the default target.
check_matches {tc37x\.cpu0} {targets}
check_matches {tc37x\.cpu1} {targets}
check_matches {tc37x\.cpu2} {targets}
check_matches {tricore} {tc37x.cpu0 cget -type}

# The board config must leave the system reset line as the only reset,
# because the AURIX debug interface cannot request a core-only reset.
check_matches {srst_only} {reset_config}

# Program flash is declared through both its cached (segment 8) and its
# non-cached (segment A) alias, so images linked at either address can be
# programmed without the caller translating addresses.
check_matches {0x80000000} {flash list}
check_matches {0xa0000000} {flash list}
check_matches {tc3x_eflash} {flash list}

# Also parse a TC4x configuration, which exercises the second flash
# driver. The TC36x, TC38x and TC39x configurations have the same
# structure as the TC37x one and cannot be sourced here, because they
# reuse its flash bank names and bank names are global.
source [find target/infineon/tc4dx.cfg]

check_matches {tc4dx\.cpucs} {targets}
check_matches {tc4x_eflash} {flash list}

shutdown
