# Parse the AURIX TC48x target configuration and check that it declares
# the expected targets and flash banks. TC48x replaces eFlash with RRAM,
# so its flash banks use the tc4x_rram driver instead of tc4x_eflash.
#
# No hardware is touched: the adapter is selected but never initialised,
# because the test shuts down before entering the run stage.

namespace import testing_helpers::*

adapter driver miniwiggler
source [find target/infineon/tc48x.cfg]

# The TC48x has four application cores plus the checker core, and cpu0 is
# the default target.
check_matches {tc48x\.cpu0} {targets}
check_matches {tc48x\.cpu1} {targets}
check_matches {tc48x\.cpu2} {targets}
check_matches {tc48x\.cpu3} {targets}
check_matches {tc48x\.cpucs} {targets}
check_matches {tricore} {tc48x.cpu0 cget -type}

# Program RRAM, data RRAM (eeprom) and UCB banks all use tc4x_rram.
check_matches {0x80000000} {flash list}
check_matches {0xae000000} {flash list}
check_matches {0xae400000} {flash list}
check_matches {tc4x_rram} {flash list}

shutdown
