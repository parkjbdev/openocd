# Parse the AURIX TC39x target configuration and check that it declares
# the expected targets and flash banks.
#
# No hardware is touched: the adapter is selected but never initialised,
# because the test shuts down before entering the run stage.

namespace import testing_helpers::*

adapter driver miniwiggler
source [find target/infineon/tc39x.cfg]

# The TC39x has six TriCore cores, and cpu0 is the default target.
check_matches {tc39x\.cpu0} {targets}
check_matches {tc39x\.cpu1} {targets}
check_matches {tc39x\.cpu2} {targets}
check_matches {tc39x\.cpu3} {targets}
check_matches {tc39x\.cpu4} {targets}
check_matches {tc39x\.cpu5} {targets}
check_matches {tricore} {tc39x.cpu0 cget -type}

# Six program flash banks, the last one smaller than the other five.
check_matches {0x80000000} {flash list}
check_matches {0x80300000} {flash list}
check_matches {0x80600000} {flash list}
check_matches {0x80900000} {flash list}
check_matches {0x80c00000} {flash list}
check_matches {0x80f00000} {flash list}
check_matches {tc3x_eflash} {flash list}

shutdown
