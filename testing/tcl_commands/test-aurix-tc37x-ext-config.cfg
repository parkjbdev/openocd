# Parse the AURIX TC37x_EXT target configuration and check that it
# declares the expected targets and flash banks.
#
# No hardware is touched: the adapter is selected but never initialised,
# because the test shuts down before entering the run stage.
#
# This cannot be sourced together with test-aurix-config-files.cfg's
# tc37x.cfg, because both configs declare flash banks with the same
# names (pfls0/pfls1/pfls0_nc/pfls1_nc) and bank names are global.

namespace import testing_helpers::*

adapter driver miniwiggler
source [find target/infineon/tc37x_EXT.cfg]

# The TC37x_EXT has three TriCore cores, and cpu0 is the default target.
check_matches {tc37x_ext\.cpu0} {targets}
check_matches {tc37x_ext\.cpu1} {targets}
check_matches {tc37x_ext\.cpu2} {targets}
check_matches {tricore} {tc37x_ext.cpu0 cget -type}

# Same single-reset-line requirement as the plain TC37x config.
check_matches {srst_only} {reset_config}

# Program flash cached and non-cached aliases, same layout as tc37x.cfg.
check_matches {0x80000000} {flash list}
check_matches {0xa0000000} {flash list}
check_matches {tc3x_eflash} {flash list}

shutdown
