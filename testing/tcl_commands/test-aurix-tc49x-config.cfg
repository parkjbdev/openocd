# Parse the AURIX TC49x target configuration and check that it declares
# the expected targets and flash banks.
#
# No hardware is touched: the adapter is selected but never initialised,
# because the test shuts down before entering the run stage.

namespace import testing_helpers::*

adapter driver miniwiggler
source [find target/infineon/tc49x.cfg]

# The TC49x has five application cores plus the checker core, and cpu0 is
# the default target.
check_matches {tc49x\.cpu0} {targets}
check_matches {tc49x\.cpu4} {targets}
check_matches {tc49x\.cpucs} {targets}
check_matches {tricore} {tc49x.cpu0 cget -type}

# Program flash plus the data flash (eeprom) and UCB banks.
check_matches {0x80000000} {flash list}
check_matches {0xae000000} {flash list}
check_matches {0xae400000} {flash list}
check_matches {tc4x_eflash} {flash list}

shutdown
