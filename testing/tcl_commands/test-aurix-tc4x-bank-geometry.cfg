# Parse-time-only TC4x bank geometry validation plus adapter/OCMTS surface
# checks for the miniWiggler, tc4x_eflash and tc4x_rram commands.
#
# No hardware is touched: the adapter is selected but never initialised, so
# the accepted/rejected flash-bank cases below are decided entirely by the
# config-stage validation in the current driver code.

namespace import testing_helpers::*

adapter driver miniwiggler
transport select ifxdap

ifxdap newtap t4 ocmts -irlen 8 -expected-id 0x10225083
ocmts create tc4xx -chain-position t4.ocmts
ocmts create tc4xx2 -chain-position t4.ocmts
target create t4.cpu0 tricore -coreid 0 -ocmts tc4xx -dbgbase 0xF8800000
target create t4.cpucs tricore -coreid 6 -ocmts tc4xx2 -dbgbase 0xF8980000
targets t4.cpu0

# --- miniWiggler adapter command surface --------------------------------
check_syntax_err {miniwiggler vid_pid}
check_syntax_err {miniwiggler vid_pid 0x058b}
check_error_matches {.*not valid.*} {miniwiggler vid_pid notanumber 0x0043}
miniwiggler vid_pid 0x058b 0x0043
check_error_matches {} {miniwiggler ioinfo}
check_error_matches {} {miniwiggler clearerr}
check_error_matches {} {miniwiggler reconnect}

# --- OCMTS binding -------------------------------------------------------
check_matches {tc4xx} {t4.cpu0 cget -ocmts}
check_matches {tc4xx2} {t4.cpucs cget -ocmts}
check_error_matches {.*cannot be changed.*} {t4.cpu0 configure -ocmts tc4xx2}

# --- tc4x_eflash accepted geometries ------------------------------------
flash bank ge_pf0_1m  tc4x_eflash 0x80000000 0x100000 0 0 t4.cpu0
flash bank ge_pf0_2m  tc4x_eflash 0x80200000 0x200000 0 0 t4.cpu0
flash bank ge_pf1_1m  tc4x_eflash 0x84000000 0x100000 0 0 t4.cpucs
flash bank ge_ucb0    tc4x_eflash 0xAE400000 0x14000  0 0 t4.cpu0
flash bank ge_ucb1    tc4x_eflash 0xAEC00000 0xD000   0 0 t4.cpu0
flash bank ge_dfls0   tc4x_eflash 0xAE000000 0x100000 0 0 t4.cpu0
flash bank ge_dfls1   tc4x_eflash 0xAE800000 0x20000  0 0 t4.cpu0

check_matches {ge_pf0_1m} {flash list}
check_matches {ge_pf0_2m} {flash list}
check_matches {ge_pf1_1m} {flash list}
check_matches {ge_ucb0} {flash list}
check_matches {ge_ucb1} {flash list}
check_matches {ge_dfls0} {flash list}
check_matches {ge_dfls1} {flash list}

# --- tc4x_eflash rejected geometries ------------------------------------
# One case per current failure mode in tc4x_flash_bank_command().
check_error_matches {} {flash bank ge_bad_pf0_size  tc4x_eflash 0x80000000 0x300000 0 0 t4.cpu0}
check_error_matches {} {flash bank ge_bad_pf0_align tc4x_eflash 0x80100000 0x200000 0 0 t4.cpu0}
check_error_matches {} {flash bank ge_bad_pf1_size  tc4x_eflash 0x84000000 0x200000 0 0 t4.cpu0}
check_error_matches {} {flash bank ge_bad_ucb0_size tc4x_eflash 0xAE400000 0x8000   0 0 t4.cpu0}
check_error_matches {} {flash bank ge_bad_ucb1_size tc4x_eflash 0xAEC00000 0x6000   0 0 t4.cpu0}
check_error_matches {} {flash bank ge_bad_dfls0_size tc4x_eflash 0xAE000000 0x200000 0 0 t4.cpu0}
check_error_matches {} {flash bank ge_bad_dfls1_size tc4x_eflash 0xAE800000 0x100000 0 0 t4.cpu0}
check_error_matches {} {flash bank ge_bad_base      tc4x_eflash 0xAF000000 0x100000 0 0 t4.cpu0}

# --- tc4x_rram parse-time surface ---------------------------------------
# The bank command itself accepts the geometry and defers layout validation to
# probe(), so these accepted cases pin the current layout table through flash
# list. fallback/unlock are exec-mode commands and must be rejected pre-init.
flash bank ge_rram_prram tc4x_rram 0x80000000 0x200000 0 0 t4.cpu0
flash bank ge_rram_dnvm  tc4x_rram 0xAE000000 0x40000  0 0 t4.cpu0
flash bank ge_rram_ucb   tc4x_rram 0xAE400000 0x8000   0 0 t4.cpu0

check_matches {ge_rram_prram} {flash list}
check_matches {ge_rram_dnvm} {flash list}
check_matches {ge_rram_ucb} {flash list}
check_matches {tc4x_rram} {flash list}

check_error_matches {} {tc4x_rram fallback ge_rram_prram}
check_error_matches {} {tc4x_rram unlock ge_rram_ucb}

# --- shipped TC48x configuration ----------------------------------------
source [find target/infineon/tc48x.cfg]

check_matches {tc48x\.cpu0} {targets}
check_matches {prram00} {flash list}
check_matches {prram21} {flash list}
check_matches {prram30} {flash list}
check_matches {ucb0} {flash list}
check_matches {eeprom1} {flash list}

shutdown
