# Argument validation and configuration checks for the AURIX TriCore
# target, the OCMTS transaction service and the AURIX eflash driver.
#
# No hardware is touched: the adapter is selected but never initialised,
# because the test shuts down before entering the run stage.

namespace import testing_helpers::*

adapter driver miniwiggler
transport select ifxdap

# 'ifxdap newtap' behaves like 'jtag newtap'.
check_syntax_err {ifxdap newtap}

ifxdap newtap tc37x ocmts -irlen 8 -expected-id 0x10207083

# 'ocmts create' requires a chain position naming an existing tap.
check_syntax_err {ocmts create}
check_error_matches {.*} {ocmts create bad -chain-position tc37x.nosuchtap}

ocmts create tc3xx -chain-position tc37x.ocmts

# A tricore target is bound to an OCMTS instance rather than to a tap
# directly, so -ocmts is mandatory and must name an existing instance.
check_error_matches {.*required when creating target.*} \
	{target create tc37x.bad tricore -coreid 0 -dbgbase 0xf8800000}
check_error_matches {.*} \
	{target create tc37x.bad tricore -coreid 0 -ocmts nosuchocmts -dbgbase 0xf8800000}

target create tc37x.cpu0 tricore -coreid 0 -ocmts tc3xx -dbgbase 0xf8800000
target create tc37x.cpu1 tricore -coreid 1 -ocmts tc3xx -dbgbase 0xf8820000
target create tc37x.cpu2 tricore -coreid 2 -ocmts tc3xx -dbgbase 0xf8840000

check_matches {tricore} {tc37x.cpu0 cget -type}
check_matches {tc3xx} {tc37x.cpu1 cget -ocmts}
check_matches {2} {tc37x.cpu2 cget -coreid}

# The program flash is visible twice. The physical bank is declared in the
# cached alias (segment 8); the non-cached alias (segment A) is exposed with
# the 'virtual' driver so that both views share a single sector array.
flash bank pfls0    tc3x_eflash 0x80000000 0x300000 0 0 tc37x.cpu0
flash bank pfls0_nc virtual     0xa0000000 0 0 0 tc37x.cpu0 pfls0

check_matches {pfls0} {flash list}
check_matches {tc3x_eflash} {flash list}
check_matches {virtual} {flash list}

# Data flash and the User Configuration Blocks live in separate address
# windows with fixed geometries. The bank command validates base and size
# up-front, before any hardware access, so the rejections below are
# checked without a target connection. The driver logs the specific
# reason; only the rejection itself is asserted here.
check_error_matches {} \
	{flash bank bad_pfls tc3x_eflash 0x80000000 0x123456 0 0 tc37x.cpu0}
check_error_matches {} \
	{flash bank bad_pfls tc3x_eflash 0x80000800 0x100000 0 0 tc37x.cpu0}
check_error_matches {} \
	{flash bank bad_dfls0 tc3x_eflash 0xaf000000 0x20000 0 0 tc37x.cpu0}
check_error_matches {} \
	{flash bank bad_dfls1 tc3x_eflash 0xafc00000 0x100000 0 0 tc37x.cpu0}
check_error_matches {} \
	{flash bank bad_ucb tc3x_eflash 0xaf400000 0x1000 0 0 tc37x.cpu0}
check_error_matches {} \
	{flash bank bad_base tc3x_eflash 0x90000000 0x100000 0 0 tc37x.cpu0}

# The correct geometries are accepted: DFLASH0 is 1MB, DFLASH1 128KB and
# the UCB window 24KB.
flash bank dfls0 tc3x_eflash 0xaf000000 0x100000 0 0 tc37x.cpu0
flash bank dfls1 tc3x_eflash 0xafc00000 0x20000  0 0 tc37x.cpu0
flash bank ucb   tc3x_eflash 0xaf400000 0x6000   0 0 tc37x.cpu0

check_matches {dfls0} {flash list}
check_matches {dfls1} {flash list}
check_matches {ucb} {flash list}

# 'aurix_eflash fallback' selects the slower per-page programming path
# used when no work area is available for the flash loader. It is an exec
# mode command and so is rejected before 'init'.
check_error_matches {} {aurix_eflash fallback enable}

shutdown
