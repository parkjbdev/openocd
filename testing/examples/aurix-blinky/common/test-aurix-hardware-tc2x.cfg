# TC2x parameterisation of the AURIX hardware regression suite.
#
# The suite itself is family neutral for sections 1-17 and reads its family
# parameters from Tcl variables. run-suite.sh cannot pass extra -c overrides,
# so this wrapper sets the TC2x values and then sources the real suite, which
# stays untouched. It must live in the same directory as the suite so that the
# runner's ELF fixture check resolves.
#
# Overrides, and why each one is what it is:
#
#   TARGET            tc27x.cpu0 is the target name created by
#                     tcl/target/infineon/tc27x.cfg.
#
#   PFLASH_ALIAS_BANKS  kept, unlike the TC4x example. tc27x.cfg does declare
#                     the non-cached aliases (pfls0_nc/pfls1_nc at 0xa0000000
#                     and 0xa0200000) with the same "virtual" driver the TC3x
#                     configs use, and the suite's own section 6 only reports
#                     a note if resolving them fails.
#
#   FLASH_TEST_ADDR   a CACHED address (0x80038000 = pfls0 sector 11). The
#                     TC375 default 0xa0028000 lands in sector 10 of the TC3x
#                     layout; TC2x sector 10 is at 0x80030000, so the default
#                     would be outside $FLASH_TEST_SECTORS. Using the cached
#                     address also keeps this check off the virtual alias write
#                     path, which is covered separately.
#
#   FLASH_TEST_SECTORS  left at {10 11}; on TC2x those are 32 KiB sectors at
#                     0x80030000 and 0x80038000, past the factory image.
#
#   DMU_BASE/DMU_PROCON_OFFSET/DMU_UNMAPPED_OFFSET  TC2x has no DMU block,
#                     but it does have an equivalent single protection
#                     register: PROCONPp (p=0-0), "PFlash Protection
#                     Configuration PFp", confirmed via the official
#                     Infineon TC21x/TC22x/TC23x User's Manual (PMU chapter,
#                     Table 11-8 "UCB_PFlash Content" and the PROCONPp
#                     register description, address "(1020H+p*4H)", reset
#                     value "0000 0000H", bit 31 = RPRO). The FLASH0 module
#                     base (0xf8001000-0xf80023ffH) is given earlier in the
#                     same chapter. DMU_BASE=0xf8001000 +
#                     DMU_PROCON_OFFSET=0x1020 = 0xf8002020; cross-checked
#                     on a real TC275 Lite Kit, which reads back
#                     0x00000000, matching the manual's stated reset value
#                     (i.e. "not protected", same bit-31 convention as
#                     TC3x/TC4x). DMU_UNMAPPED_OFFSET=0x2000 (0xf8003000)
#                     was confirmed to fault on the same board, so the
#                     "unmapped read must fail, not silently return zero"
#                     guard is meaningful here too. Note the manual's
#                     adjacent FLASH0_PROCOND (DFlash protection, explicitly
#                     given as the full address "F800 1030H" there) faults
#                     on read on this board -- only PROCONPp is visible via
#                     the debug access path, which is why only the PFlash
#                     register is used here.
#
#   PROTECT_STATE_EXPECTED  "protection state unknown", same reason as the
#                     TC4D7 wrapper: aurix_eflash_protect_check() reports
#                     every TC2x sector as unknown rather than guessing,
#                     because PROCONPp's per-sector lock bits (S0L-S26L) are
#                     not yet decoded into per-sector state by the driver.
#                     Confirmed directly against this board: with the
#                     default "not protected" string, "flash info 0" produced
#                     0 matches out of 27 sectors; every sector line reads
#                     "protection state unknown".
#
#   CRCBASE/CRCBUFSIZE  0x70000000 / 0x1c000 (112 KiB). Section 9 defaults to
#                     a 64 KiB window at 0x70010000, which runs off the end of
#                     CPU0 DSPR on a TC275: confirmed directly against this
#                     board, read_memory at 0x7001c000 ("Failed to read
#                     memory") while everything below it (down to
#                     0x70000000, the start of the work area) reads back
#                     cleanly. 0x1c000 is the full verified-readable extent,
#                     used whole rather than leaving an arbitrary margin.
#
#   STRESS            0x70010000 -- section 17's default (0x70020000) is past
#                     the same DSPR boundary (see CRCBASE above). 8 KiB at
#                     this address stays inside the verified-readable window
#                     with 16 KiB to spare, and section 17 always writes its
#                     own data before reading it back, so overlapping the
#                     section 9 CRC buffer is harmless.
#
#   ELF               ../tc27x/tc27x-blinky.elf, now that section
#                     18 is fully supported on TC2x: unlike TC3x/TC4x, TC2x's
#                     BootROM "Internal Start" fallback mode (no Boot Mode
#                     Header present) fetches the first instruction from
#                     0xa0000020, not 0xa0000000 -- confirmed against the
#                     official Infineon TC21x/22x/23x User's Manual and
#                     empirically on real TC275 hardware (see tc27x.ld's
#                     comment in that directory). tc27x-blinky.elf is linked
#                     for that entry address; tc375-blinky.elf is not, and
#                     silently traps on TC2x (NULL-pointer store from a
#                     skipped CSA-init -- see startup.S's comment for why).
#
#   BLINKY_PORT_ADDR/BLINKY_LED_MASK  left at the suite's own defaults
#                     (0xf003a000 / 0x60): TC275's LED1/LED2 are on P00.5/
#                     P00.6, confirmed identical to TC375 against the
#                     official TC275 Lite Kit manual and by register
#                     read-back on real hardware.
#
#   VERIFY_IMAGE_SUPPORTED  left at the suite's default (1): TC2x has
#                     non-cached PFLASH aliases (PFLASH_ALIAS_BANKS above),
#                     same as TC375, so tc27x-blinky.elf's 0xa0xxxxxx vector
#                     table verifies byte-for-byte like TC375's does.

set TARGET tc27x.cpu0
set PFLASH_BANKS {pfls0 pfls1}
set PFLASH_ALIAS_BANKS {pfls0_nc pfls1_nc}
set FLASH_TEST_BANK 0
set FLASH_TEST_SECTORS {10 11}
set FLASH_TEST_ADDR 0x80038000
set DMU_BASE 0xf8001000
set DMU_PROCON_OFFSET 0x1020
set DMU_UNMAPPED_OFFSET 0x2000
set PROTECT_STATE_EXPECTED "protection state unknown"
set CRCBASE 0x70000000
set CRCBUFSIZE 0x1c000
set STRESS 0x70010000
if {![info exists ELF]} {
	set ELF "[file dirname [info script]]/../tc27x/tc27x-blinky.elf"
}

source [file dirname [info script]]/test-aurix-hardware.cfg
