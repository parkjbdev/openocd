# TC4D7 wrapper around the shared AURIX hardware suite.
#
# WHY THIS FILE EXISTS
# --------------------
# test-aurix-hardware.cfg (in this same directory) is already
# parameterised for the TC4x family -- its header documents the exact overrides
# (TARGET / PFLASH_BANKS / PFLASH_ALIAS_BANKS / FLASH_TEST_ADDR). The only
# missing piece is a way to SET those variables: ab-test/run-suite.sh only
# passes "-f $BOARD_CFG -c 'adapter usb location $USB_LOC' -f $SUITE", and the
# suite reads Tcl variables via "info exists", which does not see the process
# environment. So a suite file that sets them and then sources the shared suite
# is the smallest thing that lets the guarded runner be used unchanged.
#
# Family values are taken verbatim from the header of the shared suite, not
# invented here:
#   TARGET             = tc4dx.cpu0                (tcl/target/infineon/tc4dx.cfg:54)
#   PFLASH_BANKS       = {pfls00 pfls01}           (first two banks, tc4dx.cfg:36-37)
#   PFLASH_ALIAS_BANKS = {pfls00_nc}                pfls00's non-cached alias at
#                                                   0xa0000000, declared as a
#                                                   "virtual" bank in tc4dx.cfg
#                                                   (same pattern as TC3x's
#                                                   pfls0_nc/pfls1_nc). Hardware
#                                                   confirmed: erase_check on
#                                                   this bank genuinely finds
#                                                   sectors "not erased", not
#                                                   just a non-crashing stub.
#   FLASH_TEST_ADDR    = 0x80028000                (cached, since the alias
#                                                   banks only cover pfls00,
#                                                   not pfls01)
#
# The remaining overrides below are the result of actually running the shared
# suite against a real TC4D7 Lite Kit (board/infineon/kit_a3g_tc4d7_lite.cfg),
# once ifxdap_tc4x_key_exchange() and aurix_eflash.c's tc4x_bank->fallback_mode
# default (see aurix_eflash.c) made PFLASH read/write/erase work at all:
#
#   DMU_BASE = 0xf8040000           TC4x genuinely has a DMU at the same base
#                                    address as TC3x, confirmed via the
#                                    official AURIX TC4Dx user manual v1.1
#                                    ("Registers overview - DMU": NVM.DMU incl.
#                                    SFR spans 0xf8040000-0xf807ffff) -- but
#                                    its internal layout differs, so the
#                                    offsets below are TC4x-specific.
#   DMU_PROCON_OFFSET = 0x128       GP_HOST_PFPROCON, the TC4x equivalent of
#                                    TC3x's HF_PROCONPF (user manual section
#                                    5.4.1.27, "Offset address: 0128H"; bit 31
#                                    RWPRO = 0 means unprotected, matching the
#                                    documented post-Boot-FW reset value).
#                                    Confirmed on real hardware: reads back 0.
#                                    TC3x's offset (0x80) is NOT it -- that is
#                                    tc4x_bank->reg_addr + sts_offset-adjacent
#                                    HOST command-interface space on TC4x and
#                                    reads back 0x0004009f instead.
#   DMU_UNMAPPED_OFFSET = 0x2000    TC4x's base and low offsets (0x0, 0x80)
#                                    are themselves mapped (shared HOST
#                                    command-interface SFRs), unlike TC3x, so
#                                    they cannot be used for the "unmapped
#                                    offset must fault" guard. Offset 0x2000
#                                    reliably faults on real hardware --
#                                    comfortably past the last named DMU
#                                    register in the user manual's overview
#                                    table (around offset 0x1000).
#   UNMAPPED_ADDR = 0x82000000      A gap in the PFLASH bank address space,
#                                    past the last declared bank (pfls51 ends
#                                    at 0x81400000) and well before eeprom0
#                                    (0xae000000). Confirmed by direct
#                                    read_memory on a real TC4D7 to fault
#                                    ("Failed to read memory"), unlike
#                                    0xf8040000 (see DMU_BASE above).
#   PROTECT_STATE_EXPECTED = ...    aurix_eflash_protect_check() deliberately
#                                    reports "protection state unknown" for
#                                    TC4x banks (its layout differs from
#                                    TC3x's DMU_HP_PROCONP scheme), not "not
#                                    protected", so the expected string must
#                                    match that.
#   VERIFY_IMAGE_SUPPORTED = 1      ELF is now testing/examples/aurix-blinky
#                                    /tc4d7/tc4d7-blinky.elf, a genuinely TC4D7-native
#                                    image linked at 0xa0000000 (this family's
#                                    own confirmed boot/alias address, see
#                                    tc4d7.ld), so verify_image's CRC check no
#                                    longer diverges the way it did with the
#                                    TC375-specific image.
#   BLINKY_PORT_ADDR = 0xf003ac20   P03_OUT (P03_BASE 0xf003ac00 + 0x20), the
#                                    port this family's blinky (see ELF above)
#                                    drives. LED1 = P03.9, LED2 = P03.10, both
#                                    low-active (Table 3,
#                                    infineon-aurix-tc4d7-lite-kit-userguide).
#                                    Note TC4x moved OUT/OMR to +0x20/+0x3c
#                                    (tc4-work-2026/re/IfxPort_reg.h), not
#                                    TC3x's +0x00/+0x04 -- confirmed against a
#                                    real TC4D7, LEDs visibly alternate.
#   BLINKY_LED_MASK = 0x600         bits 9 and 10 (P03.9, P03.10).
#   TC4X_KEYEXCHANGE_CHECK_ADDR     0x80000000, the PFLASH reset vector.
#     = 0x80000000                  tc4-work-2026/KEYEXCHANGE.md section 8b
#                                    first used this exact address to diagnose
#                                    a missing key exchange (every address
#                                    read back 0); it reads 0xa7011091 on this
#                                    board once the exchange succeeds, cross
#                                    checked byte for byte against a prior
#                                    backup (ext-000-80000000-65536.bin).
#   TC4X_OCMTS_OSTATE_ADDR          0xfa18006c, the TC4x-only OSTATE register
#                                    selected by ocmts_init() once the tap's
#                                    -expected-id is recognized as TC4x (see
#                                    quality-2026/REVIEW.md §2). Reading this
#                                    exact address through miniwiggler's raw
#                                    CBS path is the hardware-observable check
#                                    that guards against regressing back to the
#                                    old TC3x-only 0xf0000480 assumption.
#
# FLASH_TEST_BANK/SECTORS/ELF/SCRATCHDIR are deliberately left at their
# defaults, which are already family-neutral.
#
# Usage:
#   openocd -s tcl -f board/infineon/kit_a3g_tc4d7_lite.cfg \
#           -c "adapter usb location 1-4" \
#           -f test-aurix-hardware-tc4d7.cfg

if {![info exists ELF]} {
	set ELF "[file dirname [info script]]/../tc4d7/tc4d7-blinky.elf"
}
set TARGET tc4dx.cpu0
set PFLASH_BANKS {pfls00 pfls01}
set PFLASH_ALIAS_BANKS {pfls00_nc}
set FLASH_TEST_ADDR 0x80028000
set DMU_BASE 0xf8040000
set DMU_PROCON_OFFSET 0x128
set DMU_UNMAPPED_OFFSET 0x2000
set UNMAPPED_ADDR 0x82000000
set PROTECT_STATE_EXPECTED "protection state unknown"
set VERIFY_IMAGE_SUPPORTED 1
set BLINKY_PORT_ADDR 0xf003ac20
set BLINKY_LED_MASK 0x600
set TC4X_KEYEXCHANGE_CHECK_ADDR 0x80000000
set TC4X_OCMTS_OSTATE_ADDR 0xfa18006c

# FLASH_TEST_SECTORS {10 11} are left alone because the header requires them
# to sit past sector 0, which is where any programmed image lives on any
# family.

source [file join [file dirname [info script]] test-aurix-hardware.cfg]
