# Parse-time rejection coverage for AURIX-specific commands and flash-bank
# geometry validation. Every expected failure is wrapped in catch and causes a
# hard FAIL if it unexpectedly succeeds.

proc fail {label detail} {
    puts "FAIL: $label -- $detail"
    shutdown error
}

proc pass {label} {
    puts "PASS: $label"
}

proc expect_error {label script} {
    set code [catch {uplevel 1 $script} msg]
    if {$code == 0} {
        fail $label "unexpected success for '$script'"
    }
    pass $label
}

adapter driver miniwiggler
transport select ifxdap
ifxdap newtap tc37x ocmts -irlen 8 -expected-id 0x10207083

expect_error "ocmts syntax" {ocmts create}
expect_error "ocmts bad chain-position" {ocmts create bad -chain-position tc37x.no_such_tap}

ocmts create tc3xx -chain-position tc37x.ocmts
expect_error "target missing -ocmts" {target create tc37x.bad tricore -coreid 0 -dbgbase 0xF8800000}
expect_error "target bad -ocmts name" {target create tc37x.bad2 tricore -coreid 0 -ocmts no_such -dbgbase 0xF8800000}

target create tc37x.cpu0 tricore -coreid 0 -ocmts tc3xx -dbgbase 0xF8800000
target create tc37x.cpucs tricore -coreid 6 -ocmts tc3xx -dbgbase 0xF8980000

# TC2x failure modes.
expect_error "tc2x bad pflash size"  {flash bank t2.bad_pfls_size  tc2x_eflash 0x80000000 0x100000 0 0 tc37x.cpu0}
expect_error "tc2x bad pflash align" {flash bank t2.bad_pfls_align tc2x_eflash 0x80100000 0x200000 0 0 tc37x.cpu0}
expect_error "tc2x bad ucb size"     {flash bank t2.bad_ucb        tc2x_eflash 0xAF100000 0x2000   0 0 tc37x.cpu0}
expect_error "tc2x bad dflash0 size" {flash bank t2.bad_dfls0      tc2x_eflash 0xAF000000 0x20000  0 0 tc37x.cpu0}
expect_error "tc2x bad dflash1 size" {flash bank t2.bad_dfls1      tc2x_eflash 0xAF110000 0x20000  0 0 tc37x.cpu0}
expect_error "tc2x bad base"         {flash bank t2.bad_base       tc2x_eflash 0x90000000 0x200000 0 0 tc37x.cpu0}

# TC3x failure modes.
expect_error "tc3x bad pflash size"  {flash bank t3.bad_pfls_size  tc3x_eflash 0x80000000 0x123456 0 0 tc37x.cpu0}
expect_error "tc3x bad pflash align" {flash bank t3.bad_pfls_align tc3x_eflash 0x80000800 0x100000 0 0 tc37x.cpu0}
expect_error "tc3x bad ucb size"     {flash bank t3.bad_ucb        tc3x_eflash 0xAF400000 0x1000   0 0 tc37x.cpu0}
expect_error "tc3x bad dflash0 size" {flash bank t3.bad_dfls0      tc3x_eflash 0xAF000000 0x20000  0 0 tc37x.cpu0}
expect_error "tc3x bad dflash1 size" {flash bank t3.bad_dfls1      tc3x_eflash 0xAFC00000 0x100000 0 0 tc37x.cpu0}
expect_error "tc3x bad base"         {flash bank t3.bad_base       tc3x_eflash 0x90000000 0x100000 0 0 tc37x.cpu0}

# TC4x eFlash failure modes.
expect_error "tc4x bad pflash0 size"  {flash bank t4.bad_pf0_size  tc4x_eflash 0x80000000 0x300000 0 0 tc37x.cpu0}
expect_error "tc4x bad pflash0 align" {flash bank t4.bad_pf0_align tc4x_eflash 0x80100000 0x200000 0 0 tc37x.cpu0}
expect_error "tc4x bad pflash1 size"  {flash bank t4.bad_pf1_size  tc4x_eflash 0x84000000 0x200000 0 0 tc37x.cpucs}
expect_error "tc4x bad ucb0 size"     {flash bank t4.bad_ucb0      tc4x_eflash 0xAE400000 0x8000   0 0 tc37x.cpu0}
expect_error "tc4x bad ucb1 size"     {flash bank t4.bad_ucb1      tc4x_eflash 0xAEC00000 0x6000   0 0 tc37x.cpu0}
expect_error "tc4x bad dflash0 size"  {flash bank t4.bad_dfls0     tc4x_eflash 0xAE000000 0x30000  0 0 tc37x.cpu0}
expect_error "tc4x bad dflash1 size"  {flash bank t4.bad_dfls1     tc4x_eflash 0xAE800000 0x40000  0 0 tc37x.cpu0}
expect_error "tc4x bad base"          {flash bank t4.bad_base      tc4x_eflash 0x90000000 0x100000 0 0 tc37x.cpu0}

shutdown
