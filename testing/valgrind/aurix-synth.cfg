ifxdap newtap tc48x ocmts -irlen 8 -expected-id 0x1021D083
ocmts create tc48xx -chain-position tc48x.ocmts

target create tc48x.cpu0  tricore -coreid 0 -ocmts tc48xx -dbgbase 0xF8800000
target create tc48x.cpu1  tricore -coreid 1 -ocmts tc48xx -dbgbase 0xF8840000
target create tc48x.cpu2  tricore -coreid 2 -ocmts tc48xx -dbgbase 0xF8880000
target create tc48x.cpu3  tricore -coreid 3 -ocmts tc48xx -dbgbase 0xF88C0000
target create tc48x.cpucs tricore -coreid 6 -ocmts tc48xx -dbgbase 0xF8980000

tc48x.cpu0 configure -work-area-phys 0x70000000 -work-area-size 0x8000 -work-area-backup 0

flash bank tc48x.prram00 tc4x_rram 0x80000000 0x200000 0 0 tc48x.cpu0
flash bank tc48x.prram01 tc4x_rram 0x80200000 0x200000 0 0 tc48x.cpu0
flash bank tc48x.prram10 tc4x_rram 0x80400000 0x200000 0 0 tc48x.cpu0
flash bank tc48x.prram11 tc4x_rram 0x80600000 0x200000 0 0 tc48x.cpu0
flash bank tc48x.prram20 tc4x_rram 0x80800000 0x200000 0 0 tc48x.cpu0
flash bank tc48x.prram21 tc4x_rram 0x80900000 0x200000 0 0 tc48x.cpu0
flash bank tc48x.prram30 tc4x_rram 0x80A00000 0x200000 0 0 tc48x.cpu0
flash bank tc48x.prram31 tc4x_rram 0x80C00000 0x200000 0 0 tc48x.cpu0
flash bank tc48x.prramcs tc4x_rram 0x84000000 0x80000  0 0 tc48x.cpu0
flash bank tc48x.eeprom0 tc4x_rram 0xAE000000 0x40000  0 0 tc48x.cpu0
flash bank tc48x.ucb0    tc4x_rram 0xAE400000 0x8000   0 0 tc48x.cpu0
flash bank tc48x.eeprom1 tc4x_rram 0xAE800000 0x20000  0 0 tc48x.cpu0
flash bank tc48x.ucb1    tc4x_rram 0xAEC00000 0x8000   0 0 tc48x.cpu0

shutdown
