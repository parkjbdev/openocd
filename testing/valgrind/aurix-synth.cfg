# Synthetic, parse-time-only AURIX configuration coverage for valgrind.
#
# This file intentionally stops before 'init': it exercises Tcl/config parsing,
# target creation, and flash-bank declaration without opening a real adapter.

adapter driver miniwiggler
transport select ifxdap

# --- TC275 / TC27x -------------------------------------------------------
ifxdap newtap tc27x ocmts -irlen 8 -expected-id 0x501DA083
ocmts create tc2xx -chain-position tc27x.ocmts

target create tc27x.cpu0 tricore -coreid 0 -ocmts tc2xx -dbgbase 0xF8800000
target create tc27x.cpu1 tricore -coreid 1 -ocmts tc2xx -dbgbase 0xF8820000
target create tc27x.cpu2 tricore -coreid 2 -ocmts tc2xx -dbgbase 0xF8840000

tc27x.cpu0 configure -work-area-phys 0x70000000 -work-area-size 0x8000 -work-area-backup 0

flash bank tc27x.pfls0    tc2x_eflash 0x80000000 0x200000 0 0 tc27x.cpu0
flash bank tc27x.pfls1    tc2x_eflash 0x80200000 0x200000 0 0 tc27x.cpu0
flash bank tc27x.pfls0_nc virtual     0xA0000000 0 0 0 tc27x.cpu0 tc27x.pfls0
flash bank tc27x.pfls1_nc virtual     0xA0200000 0 0 0 tc27x.cpu0 tc27x.pfls1
flash bank tc27x.dfls0    tc2x_eflash 0xAF000000 0x60000  0 0 tc27x.cpu0
flash bank tc27x.ucb      tc2x_eflash 0xAF100000 0x4000   0 0 tc27x.cpu0
flash bank tc27x.dfls1    tc2x_eflash 0xAF110000 0x10000  0 0 tc27x.cpu0

# --- TC375 / TC37x -------------------------------------------------------
ifxdap newtap tc37x ocmts -irlen 8 -expected-id 0x10207083
ocmts create tc3xx -chain-position tc37x.ocmts

target create tc37x.cpu0 tricore -coreid 0 -ocmts tc3xx -dbgbase 0xF8800000
target create tc37x.cpu1 tricore -coreid 1 -ocmts tc3xx -dbgbase 0xF8820000
target create tc37x.cpu2 tricore -coreid 2 -ocmts tc3xx -dbgbase 0xF8840000

tc37x.cpu0 configure -work-area-phys 0x70000000 -work-area-size 0x8000 -work-area-backup 0

flash bank tc37x.pfls0    tc3x_eflash 0x80000000 0x300000 0 0 tc37x.cpu0
flash bank tc37x.pfls1    tc3x_eflash 0x80300000 0x300000 0 0 tc37x.cpu0
flash bank tc37x.pfls0_nc virtual     0xA0000000 0 0 0 tc37x.cpu0 tc37x.pfls0
flash bank tc37x.pfls1_nc virtual     0xA0300000 0 0 0 tc37x.cpu0 tc37x.pfls1

# --- TC4D7 / TC4Dx eFlash -----------------------------------------------
ifxdap newtap tc4dx ocmts -irlen 8 -expected-id 0x10225083
ocmts create tc4xx -chain-position tc4dx.ocmts

target create tc4dx.cpu0  tricore -coreid 0 -ocmts tc4xx -dbgbase 0xF8800000
target create tc4dx.cpu1  tricore -coreid 1 -ocmts tc4xx -dbgbase 0xF8840000
target create tc4dx.cpu2  tricore -coreid 2 -ocmts tc4xx -dbgbase 0xF8880000
target create tc4dx.cpu3  tricore -coreid 3 -ocmts tc4xx -dbgbase 0xF88C0000
target create tc4dx.cpu4  tricore -coreid 4 -ocmts tc4xx -dbgbase 0xF8900000
target create tc4dx.cpu5  tricore -coreid 5 -ocmts tc4xx -dbgbase 0xF8940000
target create tc4dx.cpucs tricore -coreid 6 -ocmts tc4xx -dbgbase 0xF8980000

tc4dx.cpu0 configure -work-area-phys 0x70000000 -work-area-size 0x8000 -work-area-backup 0

flash bank tc4dx.pfls00    tc4x_eflash 0x80000000 0x200000 0 0 tc4dx.cpu0
flash bank tc4dx.pfls01    tc4x_eflash 0x80200000 0x200000 0 0 tc4dx.cpu0
flash bank tc4dx.pfls00_nc virtual     0xA0000000 0 0 0 tc4dx.cpu0 tc4dx.pfls00
flash bank tc4dx.pfls10    tc4x_eflash 0x80400000 0x200000 0 0 tc4dx.cpu0
flash bank tc4dx.pfls11    tc4x_eflash 0x80600000 0x200000 0 0 tc4dx.cpu0
flash bank tc4dx.pfls20    tc4x_eflash 0x80800000 0x100000 0 0 tc4dx.cpu0
flash bank tc4dx.pfls21    tc4x_eflash 0x80900000 0x100000 0 0 tc4dx.cpu0
flash bank tc4dx.pfls30    tc4x_eflash 0x80A00000 0x200000 0 0 tc4dx.cpu0
flash bank tc4dx.pfls31    tc4x_eflash 0x80C00000 0x200000 0 0 tc4dx.cpu0
flash bank tc4dx.pfls40    tc4x_eflash 0x80E00000 0x200000 0 0 tc4dx.cpu0
flash bank tc4dx.pfls41    tc4x_eflash 0x81000000 0x200000 0 0 tc4dx.cpu0
flash bank tc4dx.pfls50    tc4x_eflash 0x81200000 0x100000 0 0 tc4dx.cpu0
flash bank tc4dx.pfls51    tc4x_eflash 0x81300000 0x100000 0 0 tc4dx.cpu0
flash bank tc4dx.pflscs    tc4x_eflash 0x84000000 0x100000 0 0 tc4dx.cpucs
flash bank tc4dx.eeprom0   tc4x_eflash 0xAE000000 0x100000 0 0 tc4dx.cpu0
flash bank tc4dx.ucb0      tc4x_eflash 0xAE400000 0x14000  0 0 tc4dx.cpu0
flash bank tc4dx.eeprom1   tc4x_eflash 0xAE800000 0x20000  0 0 tc4dx.cpu0
flash bank tc4dx.ucb1      tc4x_eflash 0xAEC00000 0xD000   0 0 tc4dx.cpu0

